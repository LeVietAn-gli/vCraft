services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: vcraft
      POSTGRES_USER: vcraft
      POSTGRES_PASSWORD: vcraft
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - vcraft-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vcraft -d vcraft']
      interval: 3s
      timeout: 3s
      retries: 15
volumes:
  vcraft-db:
