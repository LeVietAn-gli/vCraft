services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vcraft
      POSTGRES_USER: vcraft
      POSTGRES_PASSWORD: vcraft_dev_only
    ports: ["5432:5432"]
    volumes: ["vcraft_db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vcraft -d vcraft"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  vcraft_db:
